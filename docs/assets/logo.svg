<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 288" width="960" height="288" role="img" aria-labelledby="title desc">
  <title id="title">Mule Lint</title>
  <desc id="desc">Mule Lint: static analysis and configuration parity for Mule 4. A shield with a check mark next to lines of linted code.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="halo" cx="150" cy="152" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.2" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#e2e8f0" stroke-opacity="0.04" />
    </pattern>
    <clipPath id="card">
      <rect width="960" height="288" rx="28" />
    </clipPath>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="iconStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" />
      <stop offset="1" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.5" />
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#card)">
    <rect width="960" height="288" fill="url(#bg)" />
    <rect width="960" height="288" fill="url(#grid)" />
    <rect width="960" height="288" fill="url(#halo)" />
  </g>
  <rect x="0.5" y="0.5" width="959" height="287" rx="27.5" fill="none" stroke="#e2e8f0" stroke-opacity="0.08" />

  <g transform="translate(44 44)">
    <circle cx="0" cy="0" r="7" fill="#ff5f57" />
    <circle cx="24" cy="0" r="7" fill="#febc2e" />
    <circle cx="48" cy="0" r="7" fill="#28c840" />
  </g>

  <!-- Icon: shield with check mark and lint lines -->
  <g transform="translate(70 94) scale(1.1)">
    <path d="M50 0 95 15v40c0 25-20 40-45 50C25 95 5 80 5 55V15Z" fill="#0f172a" stroke="url(#iconStroke)" stroke-width="4" filter="url(#shadow)" />
    <path d="M28 52 42 66 72 36" fill="none" stroke="url(#check)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <g stroke-width="4" stroke-linecap="round">
      <path d="M107 15h25" stroke="#34d399" opacity="0.6" />
      <path d="M107 30h35" stroke="#38bdf8" opacity="0.45" />
      <path d="M107 45h20" stroke="#fbbf24" opacity="0.55" />
      <path d="M107 60h30" stroke="#34d399" opacity="0.6" />
      <path d="M107 75h15" stroke="#38bdf8" opacity="0.35" />
      <path d="M107 90h38" stroke="#34d399" opacity="0.5" />
    </g>
    <circle cx="140" cy="45" r="5" fill="#fbbf24" filter="url(#glow)" />
  </g>

  <text x="276" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5"><tspan fill="#f8fafc">Mule</tspan><tspan dx="16" fill="url(#accent)">Lint</tspan></text>
  <text x="278" y="196" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20">Static analysis and configuration parity for Mule 4</text>
</svg>
