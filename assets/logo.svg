<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" rx="24" fill="url(#bg)" filter="url(#shadow)" />

  <!-- Terminal Window Decoration -->
  <circle cx="40" cy="40" r="6" fill="#ef4444" />
  <circle cx="64" cy="40" r="6" fill="#eab308" />
  <circle cx="88" cy="40" r="6" fill="#22c55e" />

  <!-- Icon: Shield with Checkmark -->
  <g transform="translate(70, 70)">
    <!-- Shield shape -->
    <path d="M 50 0 L 95 15 L 95 55 C 95 80 75 95 50 105 C 25 95 5 80 5 55 L 5 15 Z"
          fill="#0f172a" stroke="url(#iconGrad)" stroke-width="4" filter="url(#shadow)" />

    <!-- Checkmark -->
    <path d="M 28 52 L 42 66 L 72 36"
          fill="none" stroke="url(#shieldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

    <!-- Lint lines (code representation) -->
    <line x1="105" y1="15" x2="130" y2="15" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <line x1="105" y1="30" x2="140" y2="30" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.4" />
    <line x1="105" y1="45" x2="125" y2="45" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.5" />
    <line x1="105" y1="60" x2="135" y2="60" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <line x1="105" y1="75" x2="120" y2="75" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.3" />
    <line x1="105" y1="90" x2="145" y2="90" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.5" />

    <!-- Warning dot -->
    <circle cx="140" cy="45" r="5" fill="url(#warnGrad)" filter="url(#glow)" />
  </g>

  <!-- Typography -->
  <g transform="translate(255, 125)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
      <tspan fill="#f8fafc">Mule</tspan>
      <tspan fill="url(#textGrad)">-Lint</tspan>
    </text>
    <text x="0" y="45" fill="#94a3b8" font-family="monospace" font-size="20" letter-spacing="-0.5">Static analysis for MuleSoft applications</text>
  </g>
</svg>
