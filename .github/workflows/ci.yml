name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Test CLI exit codes
        shell: bash
        run: |
          node dist/bin/mule-lint.js tests/fixtures/valid/proper-flow.xml
          set +e
          node dist/bin/mule-lint.js tests/fixtures/invalid/comprehensive-bad.xml
          status=$?
          set -e
          test "$status" -eq 1

      - name: Test CLI configuration and precedence
        shell: bash
        run: |
          json_output="$(node dist/bin/mule-lint.js tests/fixtures/valid/proper-flow.xml -c tests/fixtures/config-json.json)"
          node -e 'JSON.parse(process.argv[1])' "$json_output"

          table_output="$(node dist/bin/mule-lint.js tests/fixtures/valid/proper-flow.xml -c tests/fixtures/config-json.json -f table)"
          grep -q 'Mule-Lint Report' <<< "$table_output"

          set +e
          node dist/bin/mule-lint.js tests/fixtures/valid/proper-flow.xml -c tests/fixtures/config-invalid.json
          status=$?
          set -e
          test "$status" -eq 2

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all quality, coverage, audit, and package checks
        run: npm run check
