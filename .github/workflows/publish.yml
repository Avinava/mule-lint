name: Release & Publish

# Trigger on version tags (push v1.0.0, v1.2.3, etc.)
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # For creating GitHub releases
      id-token: write # For npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history for changelog

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify release identity
        run: node scripts/check-release.mjs --tag "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run check

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Audit shipped browser dependencies
        run: npm audit --audit-level=moderate

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Build release documentation
        run: |
          pip install -r requirements-docs.txt
          mkdocs build --strict

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Install
            ```bash
            npm install @sfdxy/mule-lint@${{ steps.version.outputs.VERSION }}
            ```

            See [CHANGELOG.md](https://github.com/Avinava/mule-lint/blob/master/CHANGELOG.md) for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify the mule-skills compatibility hub
        continue-on-error: true
        env:
          DISPATCH_TOKEN: ${{ secrets.MULE_SKILLS_DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::MULE_SKILLS_DISPATCH_TOKEN is not configured; run the mule-skills update workflow manually."
            exit 0
          fi
          payload=$(jq -n \
            --arg package "mule-lint" \
            --arg version "$VERSION" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$GITHUB_REF_NAME" \
            '{event_type:"tool_release",client_payload:{package:$package,version:$version,repository:$repository,tag:$tag}}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/Avinava/mule-skills/dispatches \
            --data "$payload"
