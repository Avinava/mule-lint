version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # 0.9 ships its own types, which changes the public Rule.validate(doc: Document) signature.
      - dependency-name: '@xmldom/xmldom'
        versions: ['>=0.9.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
